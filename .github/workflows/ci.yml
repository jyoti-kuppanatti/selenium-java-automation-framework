name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run test suite
        run: mvn clean test -Denv=qa
        continue-on-error: true
        id: run_tests

      - name: Upload Extent HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: extent-reports/
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Upload framework log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-log
          path: logs/
          if-no-files-found: ignore

      - name: Fail job if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1
